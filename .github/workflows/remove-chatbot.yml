name: Remove chatbot commands
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-chatbot.yml']
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove interactive commands; preserve daily messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          token=os.environ.get('TELEGRAM_BOT_TOKEN','').strip()
          chat=os.environ.get('TELEGRAM_CHAT_ID','').strip()
          if not token or not chat: raise RuntimeError('Missing Telegram notification secrets')
          def call(method,data):
              req=urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,data=json.dumps(data).encode(),headers={'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=25) as r: result=json.load(r)
                  if result.get('ok') is not True: raise RuntimeError('Telegram rejected cleanup')
              except Exception as exc:
                  raise RuntimeError('Telegram command cleanup failed ('+type(exc).__name__+'); secrets hidden') from None
          call('deleteMyCommands',{'scope':{'type':'chat','chat_id':chat}})
          call('setChatMenuButton',{'chat_id':chat,'menu_button':{'type':'default'}})
          call('deleteMyCommands',{'scope':{'type':'default'}})
          print('Chatbot commands removed. Daily notifications preserved.')
          PY
