name: Daily AI Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/triggers/daily-kick.txt']
  schedule:
    # 01:04, 01:12, 01:20 UTC = 07:04, 07:12, 07:20 Bangladesh time.
    # Backup to externally scheduled GitHub App push; GitHub cron is best-effort.
    - cron: '4,12,20 1 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-ai-agent-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    outputs:
      skip: ${{ steps.freshness.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Check 07:00–07:30 Bangladesh window and confirmed Telegram delivery
        id: freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python check_today.py
      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run local tests
        if: steps.freshness.outputs.skip != 'true'
        run: python -m unittest discover -s tests -v
      - name: Generate daily briefing
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FALLBACK_MODELS: gemini-3.5-flash-lite,gemini-3.8-flash
          GEMINI_RETRIES_PER_MODEL: '2'
        run: python generate.py
      - name: Upload GitHub Pages artifact
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Upload generated content for Telegram
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-site
          path: site/content.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download generated content
        uses: actions/download-artifact@v4
        with:
          name: generated-site
          path: site
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Send Telegram notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

  alert-on-failure:
    needs: [build, deploy, notify]
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.notify.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Notify Telegram about workflow failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_failure.py
