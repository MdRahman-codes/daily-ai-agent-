name = "daily-agent-adhuri"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://mdrahman-codes.github.io"
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_FALLBACK_MODELS = "gemini-3.5-flash-lite,gemini-3.8-flash"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 8
period = 60
